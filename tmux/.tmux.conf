# start window index from 1
set -g base-index 1

# start pane from 1
set -g pane-base-index 1

# new window follow current index
set -g renumber-windows on

# tmux message
set -g message-style bg='#d75f00',fg='#040404'

# Command prompt tmux
set -g message-command-style bg='#d75f00',fg='#040404' 


# turn on mouse detect
set -g mouse on


# change status line color 
set -g status-style bg='#d75f00',fg='#040404'

# Change block text colot
set -g mode-style bg='#0087af',fg='#040404'


# shortcut
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Shorcut workspace
bind s split-window -v -l 30%
